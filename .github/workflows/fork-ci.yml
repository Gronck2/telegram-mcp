# Fork-only CI for Gronck2/telegram-mcp (branch `ours`). Upstream workflows
# only run for `main`; this one runs the Pipeline contract's gates (CLAUDE.md)
# on pushes and pull requests to `ours`. Never proposed upstream.
name: Fork CI

on:
  push:
    branches: [ ours ]
  pull_request:
    branches: [ ours ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Format, lint, tests
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_ID: "12345"
      TELEGRAM_API_HASH: "dummy_hash"
      TELEGRAM_SESSION_NAME: "test_session"

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Format (black)
        run: uv run black --check .

      - name: Lint (flake8, blocking selection)
        run: uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (flake8, full report)
        run: uv run flake8 . --count --exit-zero --statistics

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
