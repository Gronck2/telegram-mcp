version: '3.8'

services:
  telegram-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: telegram-mcp
    # Load environment variables from a .env file in the same directory
    env_file:
      - .env
    # Serve streamable HTTP so one long-lived container is shared by all MCP
    # clients (see the Transports section in README.md). MCP_HOST must be
    # 0.0.0.0 inside the container for the published port to work.
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      # Server allowed roots are the ceiling for client MCP Roots (docs/adr/0004):
      # a client can only narrow them. The endpoint is unauthenticated, so keep a
      # server root set; override it in .env to use another mounted folder.
      TELEGRAM_ALLOWED_ROOTS: ${TELEGRAM_ALLOWED_ROOTS:-/app/data/files}
      # Deletion audit log on the state volume (the root filesystem is read-only).
      TELEGRAM_AUDIT_LOG: /home/appuser/.local/state/telegram-mcp/audit.log
    # The endpoint is unauthenticated — publish on localhost only.
    ports:
      - "127.0.0.1:8765:8765"
    # The image is root-owned and the container filesystem is read-only: file
    # tools cannot rewrite code, and every runtime write path is an explicit
    # mount below. /app/mcp_errors.log cannot be created on a read-only root, so
    # the error log falls back to console output (`docker logs`).
    read_only: true
    tmpfs:
      # Single-instance session locks and temporary files.
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # Voice/video-note transcript cache (SQLite, see telegram_mcp/transcription.py).
      # Without this mount the cache lives only in the container's writable
      # layer and is lost on every `docker compose build`. It holds plaintext
      # personal-chat transcripts, so this directory should get its own
      # backup/retention policy rather than riding along with a general backup.
      # Host directory must be readable/writable by uid 1000 (appuser):
      #   mkdir -p ./transcript_cache && chown 1000:1000 ./transcript_cache
      - ./transcript_cache:/app/data/transcripts
      # Alias store, incoming event feed, resolve_phone limiter state, audit log.
      - telegram_state:/home/appuser/.local/state
      # Default file-tools root (downloads, /upload/, prepare_upload).
      - telegram_files:/app/data/files
    # If you use a file session (TELEGRAM_SESSION_NAME) instead of
    # TELEGRAM_SESSION_STRING, do NOT mount over /app (it would shadow the code).
    # Mount a dedicated directory, e.g. `./telegram_sessions:/sessions`, and set
    # TELEGRAM_SESSION_NAME=/sessions/telegram_mcp_session.
    restart: unless-stopped

volumes:
  telegram_state:
  telegram_files:
